# Fun Voice Ryan 单一配置文件示例。
#
# 复制为 ${XDG_CONFIG_HOME:-~/.config}/fun-voice-ryan/config.toml 后由
# daemon 启动时通过 tomllib 读取。缺失该文件时使用代码内安全默认值；
# 未知节与未知键会被忽略（向前兼容）。
#
# 注意：热键固定为 <Super>C；模型固定为 Fun-ASR-Nano-2512；Fcitx 主通道固定为
# fcitx5；录音上限、内存阈值和“不保留历史”是安全上界，不在此处暴露、不可配置。

[audio]
# PipeWire 输入源；原样传给 `pw-record --target`。
source = "default"

[input_method]
# Fcitx 提交超时，单位：毫秒；500 即 0.5 秒。
commit_timeout_ms = 500
# fcitx 上屏失败时是否允许 XTEST Ctrl+V 回退；false 时只通知失败，不注入。
allow_x11_paste_fallback = true

[overlay]
# DTK 瞬态悬浮窗：中心位于鼠标所在屏幕工作区的 70% 高度；重启 daemon 后生效。
# 允许范围：vertical_center_ratio 0.50--0.85，width_px 420--1000，font_scale 0.80--1.80。
vertical_center_ratio = 0.70
# 固定逻辑宽度；小屏自动收缩并保留边距。
width_px = 680
# 1.0 对应状态 18pt、转写 15pt、音量 13pt 的默认大字号。
font_scale = 1.0

[inference]
# ASR profile、设备与精度由首次初始化的已验证 runtime selection 决定；这里不能覆盖。
# 已废弃的 vLLM 兼容键：原生 FunASR/PyTorch Nano 没有预分配 KV Cache，
# 因而忽略本值。保留它只是让既有配置能平滑迁移；不要将其当作内存调优项。
gpu_memory_utilization = 0.15
# 已废弃的 vLLM 兼容键：原生 Nano 忽略本值。
max_model_len = 1536
# 模型 worker 的最终防泄漏兜底；活跃会话由 daemon 显式控制停止，固定 1800 秒。
worker_failsafe_idle_seconds = 1800
# 加速器选择下仅在 Nano 无法加载或 OOM 时使用 SenseVoiceSmall；纯 CPU 选择从一开始
# 就是 SenseVoiceSmall-only，本偏好不改变首次初始化决定的 ASR profile。
allow_sensevoice_fallback = true
# 已废弃的 vLLM 兼容键：原生 Nano 忽略本值。
enforce_eager = true

[active_session]
# Nano 成功识别后的热驻留策略；窗口固定为 120 / 480 / 1800 秒。
policy = "balanced" # memory_saver | balanced | sustained
# 仅加速器 runtime selection 允许时才实际启用。
provisional_enabled = false

[enhanced]
# 启用后，ASR 完成才会启动一次 Qwen3.5-0.8B 修正子进程；进程返回即退出。
# 纯 CPU 选择下本节不生效；false 可进一步关闭 CUDA / XPU 上的修正能力。
enabled = true

[correction]
# 修正模型固定；实际设备和精度来自首次初始化，不能由 TOML 覆盖。
# 本节所有偏好在纯 CPU 选择下均不生效。
model = "Qwen/Qwen3.5-0.8B"
# Qwen 使用 Transformers 直推：只为当前请求分配低 KV Cache，不预留 vLLM KV pool。
# 单次修正的原始文本、生成 token 与子进程时限上界；不保留模型或 KV Cache。
max_source_characters = 512
max_new_tokens = 512
timeout_seconds = 30
# 可选：业务中绝不能被改写的技术词；仅当词本身出现在原始转写中时才要求原样保留。
protected_terms = []
enable_thinking = false
