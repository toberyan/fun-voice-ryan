[project]
name = "fun-voice-ryan"
version = "0.1.0"
description = "Fun Voice Ryan 本地语音输入助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fun-voice-daemon = "fun_voice.daemon:main"
fun-voice-worker = "fun_voice.worker:main"
fun-voice-bridge = "fun_voice.bridge:main"
fun-voice-preflight = "fun_voice.preflight:main"
fun-voice-selftest = "fun_voice.selftest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fun_voice"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
